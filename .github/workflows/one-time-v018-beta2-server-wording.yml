name: One-time v0.1.8 beta 2 server wording fix

on:
  push:
    paths:
      - .github/workflows/one-time-v018-beta2-server-wording.yml

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Remove remaining player-facing Service01 wording
        shell: bash
        run: |
          set -euo pipefail
          python - <<'PY'
          from pathlib import Path
          path = Path("src/AzerothQuesting.Companion/Service01Client.cs")
          text = path.read_text(encoding="utf-8")
          text = text.replace('$"Service01 {operation} failed', '$"Azeroth Questing server {operation} failed')
          text = text.replace('exists on Service01. Create a new anonymous installation identity', 'exists on the server. Create a new anonymous installation identity')
          path.write_text(text, encoding="utf-8")
          PY

      - name: Commit fix and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-v018-beta2-server-wording.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Remove remaining server test wording in beta 2"
          git push
