name: Prepare Companion Beta 10 install success UX

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-beta10-no-install-popup.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Patch Companion Beta 10
        shell: bash
        run: |
          set -euo pipefail
          FILE='src/AzerothQuesting.Companion/MainForm.cs'
          perl -0pi -e 's/\n            MessageBox\.Show\(\n                this,\n                \$"Azeroth Questing \{result\.Version\} is installed\.\\n\\nBackup: \{result\.BackupDirectory\}",\n                "Azeroth Questing Companion",\n                MessageBoxButtons\.OK,\n                MessageBoxIcon\.Information\);\n//s' "$FILE"
          if grep -Fq 'Azeroth Questing {result.Version} is installed.' "$FILE"; then
            echo 'Successful-install popup still present' >&2
            exit 1
          fi

          PROJECT='src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj'
          sed -i 's#<Version>0.1.9-beta.9</Version>#<Version>0.1.9-beta.10</Version>#' "$PROJECT"
          sed -i 's#<FileVersion>0.1.8.14</FileVersion>#<FileVersion>0.1.8.15</FileVersion>#' "$PROJECT"
          grep -F '<Version>0.1.9-beta.10</Version>' "$PROJECT"
          grep -F '<FileVersion>0.1.8.15</FileVersion>' "$PROJECT"

          printf '%s\n' \
            '# Changelog' \
            '' \
            '## 0.1.9 Beta 10 - September 12, 2026 - Available on GitHub Pre-release' \
            '' \
            '- **Changed** successful addon install/update/repair completion to stay inside the Companion dashboard instead of opening a modal Windows information message that requires clicking **OK**.' \
            '- **Kept** successful-install feedback in the existing Companion status bar and activity history, so the installed addon version remains visible without interrupting the player workflow. Error and required-action dialogs are unchanged.' \
            '- **Changed** the Companion test build to `0.1.9-beta.10` with Windows file version `0.1.8.15` because Beta 9 had already been published and consumed before this UI change was requested.' \
            '' \
            'This change affects the Companion UI only; no new Azeroth Questing addon, Website, or Azeroth Questing Server build is required. GitHub compilation/installer success does not count as Windows runtime testing. On Windows, install/update or repair the addon and verify the operation completes without the success popup shown in Beta 9, while the dashboard/status/activity still report the successful addon version. Error dialogs should still appear when an install actually fails. If trusted signing remains unavailable, this Beta may be published as an explicitly unsigned testing build; Stable still requires trusted signing.' \
            '' > CHANGELOG.new
          tail -n +3 CHANGELOG.md >> CHANGELOG.new
          mv CHANGELOG.new CHANGELOG.md
          grep -F '## 0.1.9 Beta 10 - September 12, 2026 - Available on GitHub Pre-release' CHANGELOG.md

      - name: Commit Companion Beta 10
        shell: bash
        run: |
          set -euo pipefail
          git rm .github/workflows/prepare-beta10-no-install-popup.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add CHANGELOG.md src/AzerothQuesting.Companion/MainForm.cs src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          git commit -m 'Release companion v0.1.9-beta.10'
          git push origin HEAD:main
