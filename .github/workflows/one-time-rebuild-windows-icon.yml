name: One-time rebuild Companion Windows icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-rebuild-windows-icon.yml

permissions:
  contents: write

jobs:
  rebuild:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Install Pillow
        run: python3 -m pip install --disable-pip-version-check pillow

      - name: Rebuild Windows-compatible multi-resolution icon
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          from PIL import Image

          path = Path('src/AzerothQuesting.Companion/Assets/AzerothQuesting.ico')
          with Image.open(path) as source:
              source.load()
              image = source.convert('RGBA')

          temp = path.with_suffix('.fixed.ico')
          image.save(
              temp,
              format='ICO',
              sizes=[(16, 16), (24, 24), (32, 32), (48, 48), (64, 64)],
              bitmap_format='bmp',
          )
          temp.replace(path)

          with Image.open(path) as check:
              sizes = sorted(check.ico.sizes()) if hasattr(check, 'ico') else [check.size]
              print('ICO sizes:', sizes)
              required = {(16, 16), (32, 32), (48, 48), (64, 64)}
              if not required.issubset(set(sizes)):
                  raise SystemExit(f'Missing required icon sizes: {required - set(sizes)}')
          PY

      - name: Update current Beta changelog detail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '- Fixed the Companion application icon so installed desktop and Start Menu shortcuts, the main window, Submitted Research Data window, notification-area icon, installer, and Windows uninstall entry use the Azeroth Questing icon instead of the generic Windows application icon. Existing desktop shortcuts are refreshed during an upgrade when they are already present, without creating a desktop shortcut for players who previously chose not to have one.\n'
          new = '- Fixed the Companion application icon so installed desktop and Start Menu shortcuts, the main window, Submitted Research Data window, notification-area icon, installer, and Windows uninstall entry use the Azeroth Questing icon instead of the generic Windows application icon. Rebuilt the previous single-size icon as a Windows-compatible multi-resolution `.ico`, and existing desktop shortcuts are refreshed during an upgrade when they are already present without creating a shortcut for players who previously chose not to have one.\n'
          if old not in text:
              raise SystemExit('Expected current icon changelog bullet was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit corrected icon asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Frostcanvas
          git config user.email 131615585+Frostcanvas@users.noreply.github.com
          git add src/AzerothQuesting.Companion/Assets/AzerothQuesting.ico CHANGELOG.md
          git commit -m 'Rebuild Companion multi-resolution Windows icon'
          git push origin HEAD:main
