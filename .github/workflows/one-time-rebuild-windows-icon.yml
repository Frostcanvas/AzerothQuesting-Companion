name: One-time restore valid Companion Windows icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-rebuild-windows-icon.yml

permissions:
  contents: write

jobs:
  restore:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository with history
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Restore last known-good multi-resolution icon
        shell: bash
        run: |
          set -euo pipefail
          git checkout e5793d68203d96b660a0032f22a9a8f8012a6743 -- src/AzerothQuesting.Companion/Assets/AzerothQuesting.ico

          python3 - <<'PY'
          from pathlib import Path
          import struct

          path = Path('src/AzerothQuesting.Companion/Assets/AzerothQuesting.ico')
          data = path.read_bytes()
          if len(data) < 6:
              raise SystemExit('ICO is too short')

          reserved, icon_type, count = struct.unpack_from('<HHH', data, 0)
          if reserved != 0 or icon_type != 1 or count < 4:
              raise SystemExit(f'Unexpected ICO header: reserved={reserved}, type={icon_type}, count={count}')

          sizes = []
          for i in range(count):
              offset = 6 + i * 16
              width, height, colors, reserved2, planes, bit_count, byte_count, image_offset = struct.unpack_from('<BBBBHHII', data, offset)
              width = 256 if width == 0 else width
              height = 256 if height == 0 else height
              end = image_offset + byte_count
              if image_offset < 6 + count * 16 or end > len(data):
                  raise SystemExit(f'ICO entry {i} is truncated or invalid: offset={image_offset}, bytes={byte_count}, file={len(data)}')
              sizes.append((width, height, bit_count, byte_count))

          print('Validated ICO entries:', sizes)
          required = {(16, 16), (32, 32), (48, 48), (64, 64)}
          actual = {(w, h) for w, h, _, _ in sizes}
          if not required.issubset(actual):
              raise SystemExit(f'Missing required icon sizes: {sorted(required - actual)}')
          PY

      - name: Update current Beta changelog detail
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path
          path = Path('CHANGELOG.md')
          text = path.read_text(encoding='utf-8')
          old = '- Fixed the Companion application icon so installed desktop and Start Menu shortcuts, the main window, Submitted Research Data window, notification-area icon, installer, and Windows uninstall entry use the Azeroth Questing icon instead of the generic Windows application icon. Existing desktop shortcuts are refreshed during an upgrade when they are already present, without creating a desktop shortcut for players who previously chose not to have one.\n'
          new = '- Fixed the Companion application icon so installed desktop and Start Menu shortcuts, the main window, Submitted Research Data window, notification-area icon, installer, and Windows uninstall entry use the Azeroth Questing icon instead of the generic Windows application icon. Restored the known-good 16/32/48/64-pixel multi-resolution Windows icon after finding the later single-image icon resource was truncated, and existing desktop shortcuts are refreshed during an upgrade when they are already present without creating a shortcut for players who previously chose not to have one.\n'
          if old not in text:
              raise SystemExit('Expected current icon changelog bullet was not found')
          path.write_text(text.replace(old, new, 1), encoding='utf-8')
          PY
          git diff --check

      - name: Commit restored icon asset
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Frostcanvas
          git config user.email 131615585+Frostcanvas@users.noreply.github.com
          git add src/AzerothQuesting.Companion/Assets/AzerothQuesting.ico CHANGELOG.md
          git commit -m 'Restore valid Companion multi-resolution Windows icon'
          git push origin HEAD:main
