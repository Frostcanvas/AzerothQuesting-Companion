name: Repair Companion Beta 6 completed quest handoff

on:
  push:
    branches:
      - main
    paths:
      - '.github/workflows/prepare-completed-quest-client-beta6.yml'

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Add completed quest UI event handler
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/AzerothQuesting.Companion/MainForm.cs')
          text = path.read_text(encoding='utf-8')
          signature = '    private void WatcherOnCompletedQuestDataProcessed(object? sender, CompletedQuestDataEventArgs e)\n'
          if signature not in text:
              anchor = '    private void WatcherOnError(object? sender, string message)\n'
              handler = '''    private void WatcherOnCompletedQuestDataProcessed(object? sender, CompletedQuestDataEventArgs e)\n    {\n        SafeUi(() =>\n        {\n            _lastDataValue.Text = e.Changed\n                ? $"{DateTime.Now:g} - completed quests"\n                : $"{DateTime.Now:g} - completed unchanged";\n            RefreshLocalStatus();\n            if (e.Changed)\n            {\n                SetStatus($"Received {e.QuestCount} completed quests for {e.Character}-{e.Realm} from the addon.");\n                AddActivity($"Completed quest data received for {e.Character}-{e.Realm}: {e.QuestCount} quests (local only).");\n            }\n        });\n    }\n\n'''
              if anchor not in text:
                  raise SystemExit('MainForm watcher error handler anchor not found')
              text = text.replace(anchor, handler + anchor, 1)
              path.write_text(text, encoding='utf-8')
          PY

      - name: Commit repair
        shell: bash
        run: |
          set -euo pipefail
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add src/AzerothQuesting.Companion/MainForm.cs
          if git diff --cached --quiet; then
            echo 'No repair needed.'
            exit 0
          fi
          git commit -m 'Fix Companion Beta 6 completed quest UI handler'
          git push origin HEAD:main
