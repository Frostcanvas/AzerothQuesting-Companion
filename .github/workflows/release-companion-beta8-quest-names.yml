name: Release Companion Beta 8 quest names

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  release:
    if: github.event.head_commit.message == 'Prepare Companion Beta 8 quest names'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Apply AQO2 quest-name support
        shell: bash
        run: |
          python - <<'PY'
          from pathlib import Path

          def replace_once(text, old, new, label):
              if old not in text:
                  raise SystemExit(f"Missing expected block: {label}")
              return text.replace(old, new, 1)

          path = Path('src/AzerothQuesting.Companion/Service01Client.cs')
          text = path.read_text(encoding='utf-8')
          text = replace_once(text,
              '''            var parts = wire.Split('|');\n            if (parts.Length != 13 || parts[0] != "AQO1")\n            {\n                continue;\n            }''',
              '''            var parts = wire.Split('|');\n            var isAqo1 = parts.Length == 13 && parts[0] == "AQO1";\n            var isAqo2 = parts.Length == 14 && parts[0] == "AQO2";\n            if (!isAqo1 && !isAqo2)\n            {\n                continue;\n            }''',
              'AQO version guard')
          old = '''            observations[parts[1]] = new QuestObservationRequest\n            {\n                Key = parts[1],\n                Source = parts[2],\n                QuestId = questId,\n                MapId = mapId,\n                Evidence = parts[5],\n                Faction = parts[6],\n                ClassId = classId,\n                ClassFile = parts[8],\n                Level = level,\n                Completed = parts[10] == "1",\n                ObservedAt = observedTime,\n                AddonVersion = parts[12],\n            };'''
          new = '''            string? questName = null;\n            if (isAqo2 && !TryDecodeQuestName(parts[13], out questName))\n            {\n                continue;\n            }\n\n            var candidate = new QuestObservationRequest\n            {\n                Key = parts[1],\n                Source = parts[2],\n                QuestId = questId,\n                QuestName = questName,\n                MapId = mapId,\n                Evidence = parts[5],\n                Faction = parts[6],\n                ClassId = classId,\n                ClassFile = parts[8],\n                Level = level,\n                Completed = parts[10] == "1",\n                ObservedAt = observedTime,\n                AddonVersion = parts[12],\n            };\n\n            if (!observations.TryGetValue(parts[1], out var existing)\n                || (!string.IsNullOrWhiteSpace(candidate.QuestName)\n                    && string.IsNullOrWhiteSpace(existing.QuestName)))\n            {\n                observations[parts[1]] = candidate;\n            }'''
          text = replace_once(text, old, new, 'AQO2 candidate preference')
          helper = '''    private static bool TryDecodeQuestName(string value, out string? questName)\n    {\n        questName = null;\n        if (string.IsNullOrEmpty(value))\n        {\n            return true;\n        }\n        if ((value.Length % 2) != 0 || !HexStringRegex().IsMatch(value))\n        {\n            return false;\n        }\n\n        try\n        {\n            var decoded = Encoding.UTF8.GetString(Convert.FromHexString(value));\n            if (decoded.Length > 512)\n            {\n                return false;\n            }\n            questName = string.IsNullOrWhiteSpace(decoded) ? null : decoded;\n            return true;\n        }\n        catch (FormatException)\n        {\n            return false;\n        }\n    }\n\n'''
          text = replace_once(text,
              '    private static string TrimForError(string value)',
              helper + '    private static string TrimForError(string value)',
              'quest-name decoder')
          text = replace_once(text,
              '[GeneratedRegex(@"AQO1\\|[A-Za-z0-9._:|\\-]+", RegexOptions.CultureInvariant)]',
              '[GeneratedRegex(@"AQO[12]\\|[A-Za-z0-9._:|\\-]+", RegexOptions.CultureInvariant)]',
              'AQO wire regex')
          text = replace_once(text,
              '''    [GeneratedRegex(@"^[A-Za-z0-9._:-]+$", RegexOptions.CultureInvariant)]\n    private static partial Regex ObservationKeyRegex();''',
              '''    [GeneratedRegex(@"^[A-Za-z0-9._:-]+$", RegexOptions.CultureInvariant)]\n    private static partial Regex ObservationKeyRegex();\n\n    [GeneratedRegex(@"^[0-9A-Fa-f]+$", RegexOptions.CultureInvariant)]\n    private static partial Regex HexStringRegex();''',
              'hex regex')
          text = replace_once(text,
              '''        [JsonPropertyName("quest_id")]\n        public int QuestId { get; set; }\n\n        [JsonPropertyName("map_id")]''',
              '''        [JsonPropertyName("quest_id")]\n        public int QuestId { get; set; }\n\n        [JsonPropertyName("quest_name")]\n        [JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingNull)]\n        public string? QuestName { get; set; }\n\n        [JsonPropertyName("map_id")]''',
              'quest_name request field')
          path.write_text(text, encoding='utf-8')

          project_path = Path('src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj')
          project = project_path.read_text(encoding='utf-8')
          project = replace_once(project, '<Version>0.1.9-beta.7</Version>', '<Version>0.1.9-beta.8</Version>', 'Companion version')
          project = replace_once(project, '<FileVersion>0.1.8.12</FileVersion>', '<FileVersion>0.1.8.13</FileVersion>', 'Companion file version')
          project_path.write_text(project, encoding='utf-8')

          privacy_path = Path('PRIVACY.md')
          privacy = privacy_path.read_text(encoding='utf-8')
          privacy = replace_once(privacy, 'Last updated: September 10, 2026', 'Last updated: September 11, 2026', 'privacy date')
          privacy = replace_once(privacy,
              'observation key, local/anonymous-peer source, quest ID, map ID, evidence type',
              'observation key, local/anonymous-peer source, quest ID, cached quest title when available, map ID, evidence type',
              'privacy structured fields')
          privacy_path.write_text(privacy, encoding='utf-8')

          changelog_path = Path('CHANGELOG.md')
          changelog = changelog_path.read_text(encoding='utf-8')
          header = '# Changelog\n\n'
          if not changelog.startswith(header):
              raise SystemExit('Unexpected Companion changelog header')
          if '## 0.1.9 Beta 8 -' in changelog:
              raise SystemExit('Companion Beta 8 changelog entry already exists')
          entry = '''## 0.1.9 Beta 8 - September 11, 2026 - Available on GitHub Pre-release\n\n- **Added** `AQO2` parsing for normal research observations that include an optional hex-encoded UTF-8 quest title. The Companion continues parsing legacy `AQO1` records and prefers the named `AQO2` copy when both carry the same observation key, preventing duplicate uploads while preserving backward compatibility.\n- **Added** optional `quest_name` transmission to the Azeroth Questing Server batch API. The field is omitted when no title is known, so legacy AQO1 observations keep their existing payload shape.\n- **Kept** research privacy unchanged apart from the public World of Warcraft quest title itself. Character name, realm, account/BattleTag, peer sender identity, local file path, and other player identity are still excluded from structured research observations.\n- **Updated** the Companion privacy description to include cached quest title as an optional structured research field.\n- **Changed** the Companion test build to `0.1.9-beta.8` with Windows file version `0.1.8.13` because Beta 7 had already been published/consumed before normal research quest-title support was requested.\n\nBeta 8 remains compatible with older addon AQO1 data. Azeroth Questing Addon `0.3.0-beta.7` or newer is required to produce named AQO2 records, and Azeroth Questing Server API `0.2.6` or newer is required to accept/store `quest_name`. The Website Quest Repository already supports displaying/searching quest names, so no Website build is required. GitHub compilation/installer success does not count as Windows, WoW, live server, or production website testing. After the compatible server is deployed, verify AQO1-only observations still synchronize, AQO2 observations upload one deduplicated row with the correct quest title, and the public Quest Repository shows that title without exposing player identity.\n\n'''
          changelog_path.write_text(header + entry + changelog[len(header):], encoding='utf-8')
          PY
          git diff --check
      - name: Commit and push Beta 8
        shell: bash
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AzerothQuesting.Companion/Service01Client.cs src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj PRIVACY.md CHANGELOG.md
          git commit -m "Release companion v0.1.9-beta.8 research quest names"
          git push origin main
