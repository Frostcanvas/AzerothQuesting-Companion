name: One-time Companion 0.1.9 Beta 3 preparation

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply Beta 3 endpoint fix and changelog
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          client = Path('src/AzerothQuesting.Companion/Service01Client.cs')
          text = client.read_text(encoding='utf-8')
          old = '''value = string.IsNullOrWhiteSpace(value)
                      ? "http://10.0.10.246:8766"
                      : value.Trim();'''
          new = '''value = string.IsNullOrWhiteSpace(value)
                      ? SettingsService.DefaultServiceBaseUrl
                      : value.Trim();'''
          if old not in text:
              raise SystemExit('Expected legacy NormalizeBaseUrl fallback was not found')
          client.write_text(text.replace(old, new, 1), encoding='utf-8')

          github_client = Path('src/AzerothQuesting.Companion/GitHubAddonClient.cs')
          text = github_client.read_text(encoding='utf-8')
          text = text.replace('new ProductInfoHeaderValue("AzerothQuestingCompanion", "0.1.8")', 'new ProductInfoHeaderValue("AzerothQuestingCompanion", "0.1.9")', 1)
          github_client.write_text(text, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          text = changelog.read_text(encoding='utf-8')
          header = '# Changelog\n\n'
          if not text.startswith(header):
              raise SystemExit('Unexpected Companion changelog header')
          entry = '''## 0.1.9 Beta 3 - September 9, 2026

          - Fixed the final server-endpoint fallback in `Service01Client.NormalizeBaseUrl`. If the configured endpoint is blank at runtime, the Companion now falls back to `https://aq.frostlabs.dev` through `SettingsService.DefaultServiceBaseUrl` instead of the retired private LAN address.
          - Kept the existing one-time migration from the exact legacy LAN endpoint to the public HTTPS endpoint and preserved manually configured custom endpoints.
          - Updated the Companion GitHub API user-agent version from `0.1.8` to the current `0.1.9` train.
          - Advanced the next testable Companion build to `0.1.9-beta.3` because Beta 2 had already been handed off for testing before this endpoint fallback correction.
          - Recorded the actual public-ingress test status: `https://aq.frostlabs.dev/api/v1/status` was successfully reached from a phone on cellular data and returned Azeroth Questing Server API `0.2.4`; the public `/research` page did not expose the internal dashboard. This confirms the public server route, not a full Companion synchronization test.

          Beta 3 still requires Windows testing. Verify the repaired Azeroth Questing icon on installed Windows surfaces, select the Beta channel, confirm the Companion uses `https://aq.frostlabs.dev`, then test registration, heartbeat, Submitted Research Data, Pending Observations synchronization, Companion self-update, and addon update from an outside network. Do not treat the cellular API test as proof that the Windows Companion path has passed. The WoW addon version is managed independently.

          '''
          entry = '\n'.join(line[10:] if line.startswith('          ') else line for line in entry.splitlines()) + '\n\n'
          changelog.write_text(header + entry + text[len(header):], encoding='utf-8')
          PY

      - name: Remove one-time workflow and commit
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "Frostcanvas"
          git config user.email "131615585+Frostcanvas@users.noreply.github.com"
          git rm .github/workflows/one-time-beta3-prep.yml
          git add src/AzerothQuesting.Companion/Service01Client.cs src/AzerothQuesting.Companion/GitHubAddonClient.cs CHANGELOG.md
          git commit -m "Prepare Companion 0.1.9 Beta 3"
          git push origin HEAD:main
