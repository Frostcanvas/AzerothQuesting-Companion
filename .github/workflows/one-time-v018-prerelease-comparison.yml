name: One-time v0.1.8 prerelease comparison patch

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Patch MainForm prerelease comparison
        shell: bash
        run: |
          python - <<'PY'
          import re
          from pathlib import Path

          path = Path("src/AzerothQuesting.Companion/MainForm.cs")
          text = path.read_text(encoding="utf-8")

          pattern = re.compile(
              r"    private static bool VersionsMatch\(string left, string right\)\n"
              r"    \{.*?"
              r"    private static string GetClientVersion\(\)\n"
              r"    \{.*?\n"
              r"    \}\n",
              re.DOTALL,
          )

          replacement = (
              "    private static bool VersionsMatch(string left, string right)\n"
              "    {\n"
              "        return ReleaseVersionUtility.Matches(left, right);\n"
              "    }\n\n"
              "    private static bool IsNewerVersion(string current, string remote)\n"
              "    {\n"
              "        return ReleaseVersionUtility.IsNewer(current, remote);\n"
              "    }\n\n"
              "    private static string GetClientVersion()\n"
              "    {\n"
              "        var assembly = Assembly.GetExecutingAssembly();\n"
              "        var informational = assembly.GetCustomAttribute<AssemblyInformationalVersionAttribute>()?.InformationalVersion;\n"
              "        if (!string.IsNullOrWhiteSpace(informational))\n"
              "        {\n"
              "            var displayVersion = informational.Split('+', 2)[0].Trim();\n"
              "            if (ReleaseVersionUtility.TryParse(displayVersion, out _))\n"
              "            {\n"
              "                return displayVersion;\n"
              "            }\n"
              "        }\n\n"
              "        var version = assembly.GetName().Version;\n"
              "        return version is null ? \"0.1.8-beta.1\" : $\"{version.Major}.{version.Minor}.{version.Build}\";\n"
              "    }\n"
          )

          updated, count = pattern.subn(replacement, text, count=1)
          if count != 1:
              raise SystemExit(f"Expected exactly one MainForm version block, found {count}; refusing to patch.")

          path.write_text(updated, encoding="utf-8")
          PY

      - name: Commit patch
        shell: bash
        run: |
          set -euo pipefail
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/AzerothQuesting.Companion/MainForm.cs
          if git diff --cached --quiet; then
            echo "No patch was needed."
            exit 0
          fi
          git commit -m "Use prerelease-aware update comparison [skip ci]"
          git push
