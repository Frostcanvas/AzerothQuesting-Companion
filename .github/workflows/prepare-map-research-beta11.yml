name: Prepare Companion map research Beta 11

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-map-research-beta11.yml
      - .github/scripts/prepare_map_beta11.py

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply patch
        run: python3 .github/scripts/prepare_map_beta11.py

      - name: Validate build
        run: |
          dotnet restore src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          dotnet build src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj -c Release --no-restore
          git diff --check

      - name: Commit Companion Beta 11
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-map-research-beta11.yml .github/scripts/prepare_map_beta11.py
          git add CHANGELOG.md src/AzerothQuesting.Companion/Service01Client.cs src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          git commit -m "Release companion v0.1.9-beta.11"
          git push origin HEAD:main
