name: Prepare Companion map research Beta 11

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/prepare-map-research-beta11.yml

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Apply Companion Beta 11 map research patch
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          path = Path('src/AzerothQuesting.Companion/Service01Client.cs')
          text = path.read_text(encoding='utf-8')

          old_sync = '''            var text = await File.ReadAllTextAsync(path, cancellationToken);
            var observations = ExtractWireObservations(text);

            if (observations.Count > 0)
            {
                for (var offset = 0; offset < observations.Count; offset += BatchSize)
                {
                    var batch = observations.Skip(offset).Take(BatchSize).ToArray();
                    var addonVersion = batch.LastOrDefault()?.AddonVersion;
                    var response = await SendBatchWithRegistrationRetryAsync(
                        batch,
                        addonVersion,
                        companionVersion,
                        cancellationToken);
                    uploadedObservations += response.Accepted;
                    duplicates += response.Duplicates;
                }
            }
            else
            {
                // v0.2.31 and older snapshots do not contain AQO1 records. Keep a
                // raw, SHA-256 checked compatibility path so those already-queued
                // observations are not discarded during the sync upgrade.
                await SendRawSnapshotWithRegistrationRetryAsync(
                    text,
                    companionVersion,
                    cancellationToken);
            }
'''
          new_sync = '''            var text = await File.ReadAllTextAsync(path, cancellationToken);
            var questObservations = ExtractWireObservations(text);
            var mapObservations = ExtractMapWireObservations(text);

            if (questObservations.Count > 0 || mapObservations.Count > 0)
            {
                for (var offset = 0; offset < questObservations.Count; offset += BatchSize)
                {
                    var batch = questObservations.Skip(offset).Take(BatchSize).ToArray();
                    var addonVersion = batch.LastOrDefault()?.AddonVersion;
                    var response = await SendBatchWithRegistrationRetryAsync(
                        batch,
                        addonVersion,
                        companionVersion,
                        cancellationToken);
                    uploadedObservations += response.Accepted;
                    duplicates += response.Duplicates;
                }

                for (var offset = 0; offset < mapObservations.Count; offset += BatchSize)
                {
                    var batch = mapObservations.Skip(offset).Take(BatchSize).ToArray();
                    var addonVersion = batch.LastOrDefault()?.AddonVersion;
                    var response = await SendMapBatchWithRegistrationRetryAsync(
                        batch,
                        addonVersion,
                        companionVersion,
                        cancellationToken);
                    uploadedObservations += response.Accepted;
                    duplicates += response.Duplicates;
                }
            }
            else
            {
                // Older snapshots may not contain structured AQO/AQM records. Keep a
                // raw, SHA-256 checked compatibility path so already-queued data is
                // not discarded during research protocol upgrades.
                await SendRawSnapshotWithRegistrationRetryAsync(
                    text,
                    companionVersion,
                    cancellationToken);
            }
'''
          if old_sync not in text:
              raise SystemExit('SyncOutbox block not found')
          text = text.replace(old_sync, new_sync, 1)

          send_marker = '''    private async Task<BatchResponse> ReadBatchResponseAsync(HttpResponseMessage response, CancellationToken cancellationToken)
'''
          send_map = '''    private async Task<BatchResponse> SendMapBatchWithRegistrationRetryAsync(
        IReadOnlyCollection<MapObservationRequest> observations,
        string? addonVersion,
        string companionVersion,
        CancellationToken cancellationToken)
    {
        var request = new MapBatchRequest
        {
            AddonVersion = addonVersion,
            CompanionVersion = companionVersion,
            Observations = observations.ToArray(),
        };

        using var response = await PostJsonAsync(
            "/api/v1/maps/batch",
            request,
            _settings.InstallationToken,
            cancellationToken);

        if (response.StatusCode == HttpStatusCode.Unauthorized)
        {
            ClearRegistration();
            await EnsureRegisteredAsync(companionVersion, cancellationToken);
            using var retry = await PostJsonAsync(
                "/api/v1/maps/batch",
                request,
                _settings.InstallationToken,
                cancellationToken);
            return await ReadBatchResponseAsync(retry, cancellationToken);
        }

        return await ReadBatchResponseAsync(response, cancellationToken);
    }

'''
          if send_marker not in text:
              raise SystemExit('ReadBatchResponse marker not found')
          text = text.replace(send_marker, send_map + send_marker, 1)

          decode_marker = '''    private static bool TryDecodeQuestName(string value, out string? questName)
'''
          map_parser = '''    private static List<MapObservationRequest> ExtractMapWireObservations(string snapshot)
    {
        var observations = new Dictionary<string, MapObservationRequest>(StringComparer.Ordinal);

        foreach (Match match in MapWireRecordRegex().Matches(snapshot))
        {
            var parts = match.Value.Split('|');
            if (parts.Length != 17 || parts[0] != "AQM1")
            {
                continue;
            }

            if (!int.TryParse(parts[2], out var mapId) || mapId <= 0
                || !int.TryParse(parts[4], out var parentMapId) || parentMapId < 0
                || !int.TryParse(parts[5], out var mapType) || mapType < 0 || mapType > 255
                || !int.TryParse(parts[8], out var difficultyId) || difficultyId < 0
                || !int.TryParse(parts[9], out var instanceId) || instanceId < 0
                || !int.TryParse(parts[11], out var classId) || classId < 0 || classId > 30
                || !int.TryParse(parts[13], out var level) || level < 0 || level > 255
                || !long.TryParse(parts[15], out var observedAt) || observedAt <= 0)
            {
                continue;
            }

            if (parts[10] is not ("Alliance" or "Horde" or "Neutral")
                || !ClassFileRegex().IsMatch(parts[12])
                || !ObservationKeyRegex().IsMatch(parts[1])
                || !InstanceTypeRegex().IsMatch(parts[7]))
            {
                continue;
            }

            DateTimeOffset observedTime;
            try
            {
                observedTime = DateTimeOffset.FromUnixTimeSeconds(observedAt);
            }
            catch (ArgumentOutOfRangeException)
            {
                continue;
            }

            if (!TryDecodeQuestName(parts[3], out var mapName)
                || !TryDecodeQuestName(parts[6], out var instanceName)
                || !TryDecodeQuestName(parts[14], out var phase))
            {
                continue;
            }

            observations[parts[1]] = new MapObservationRequest
            {
                Key = parts[1],
                MapId = mapId,
                MapName = mapName,
                ParentMapId = parentMapId,
                MapType = mapType,
                InstanceName = instanceName,
                InstanceType = parts[7],
                DifficultyId = difficultyId,
                InstanceId = instanceId,
                Faction = parts[10],
                ClassId = classId,
                ClassFile = parts[12],
                Level = level,
                Phase = phase,
                ObservedAt = observedTime,
                AddonVersion = parts[16],
            };
        }

        return observations.Values
            .OrderBy(item => item.ObservedAt)
            .ThenBy(item => item.Key, StringComparer.Ordinal)
            .ToList();
    }

'''
          if decode_marker not in text:
              raise SystemExit('Decode marker not found')
          text = text.replace(decode_marker, map_parser + decode_marker, 1)

          regex_marker = '''    [GeneratedRegex(@"^[A-Z]+$", RegexOptions.CultureInvariant)]
    private static partial Regex ClassFileRegex();
'''
          regex_replacement = '''    [GeneratedRegex(@"AQM1\\|[A-Za-z0-9._:|\\-]+", RegexOptions.CultureInvariant)]
    private static partial Regex MapWireRecordRegex();

    [GeneratedRegex(@"^[A-Za-z_]+$", RegexOptions.CultureInvariant)]
    private static partial Regex InstanceTypeRegex();

''' + regex_marker
          if regex_marker not in text:
              raise SystemExit('Regex marker not found')
          text = text.replace(regex_marker, regex_replacement, 1)

          model_marker = '''    private sealed class BatchResponse
    {
'''
          map_models = '''    private sealed class MapBatchRequest
    {
        [JsonPropertyName("addon_version")]
        public string? AddonVersion { get; set; }

        [JsonPropertyName("companion_version")]
        public string? CompanionVersion { get; set; }

        [JsonPropertyName("observations")]
        public MapObservationRequest[] Observations { get; set; } = [];
    }

    private sealed class MapObservationRequest
    {
        [JsonPropertyName("key")]
        public string Key { get; set; } = string.Empty;

        [JsonPropertyName("map_id")]
        public int MapId { get; set; }

        [JsonPropertyName("map_name")]
        [JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingNull)]
        public string? MapName { get; set; }

        [JsonPropertyName("parent_map_id")]
        public int ParentMapId { get; set; }

        [JsonPropertyName("map_type")]
        public int MapType { get; set; }

        [JsonPropertyName("instance_name")]
        [JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingNull)]
        public string? InstanceName { get; set; }

        [JsonPropertyName("instance_type")]
        public string InstanceType { get; set; } = "none";

        [JsonPropertyName("difficulty_id")]
        public int DifficultyId { get; set; }

        [JsonPropertyName("instance_id")]
        public int InstanceId { get; set; }

        [JsonPropertyName("faction")]
        public string Faction { get; set; } = string.Empty;

        [JsonPropertyName("class_id")]
        public int ClassId { get; set; }

        [JsonPropertyName("class_file")]
        public string ClassFile { get; set; } = string.Empty;

        [JsonPropertyName("level")]
        public int Level { get; set; }

        [JsonPropertyName("phase")]
        [JsonIgnore(Condition = JsonIgnoreCondition.WhenWritingNull)]
        public string? Phase { get; set; }

        [JsonPropertyName("observed_at")]
        public DateTimeOffset ObservedAt { get; set; }

        [JsonIgnore]
        public string AddonVersion { get; set; } = string.Empty;
    }

'''
          if model_marker not in text:
              raise SystemExit('BatchResponse marker not found')
          text = text.replace(model_marker, map_models + model_marker, 1)
          path.write_text(text, encoding='utf-8')

          project = Path('src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj')
          csproj = project.read_text(encoding='utf-8')
          csproj = csproj.replace('<Version>0.1.9-beta.10</Version>', '<Version>0.1.9-beta.11</Version>', 1)
          csproj = csproj.replace('<FileVersion>0.1.8.15</FileVersion>', '<FileVersion>0.1.8.16</FileVersion>', 1)
          if '<Version>0.1.9-beta.11</Version>' not in csproj or '<FileVersion>0.1.8.16</FileVersion>' not in csproj:
              raise SystemExit('Companion version bump failed')
          project.write_text(csproj, encoding='utf-8')

          changelog = Path('CHANGELOG.md')
          current = changelog.read_text(encoding='utf-8')
          entry = '''# Changelog

## 0.1.9 Beta 11 - September 12, 2026 - Available on GitHub Pre-release

- **Added** parsing and upload support for the addon's new identity-free `AQM1` map observations. The Companion now recognizes UiMapID research alongside existing `AQO1`/`AQO2` quest observations and sends map batches to the Azeroth Questing Server without copying character name, realm, BattleTag, local file path, or peer identity.
- **Added** structured map context fields needed to distinguish phased or scenario copies of places such as Battle for Darkshore and Battle for Stromgarde: UiMapID, map name, parent UiMapID, UI map type, instance name/type, difficulty ID, instance ID, faction, class, level, optional phase label, observation time, and addon version.
- **Kept** existing quest observation and completed-quest synchronization unchanged. Map observations share the normal retryable Outbox and are counted as research observations in sync status.
- **Changed** the Companion test build to `0.1.9-beta.11` with Windows file version `0.1.8.16` because Beta 10 had already been published and consumed before map-ID research support was requested.

Beta 11 requires Azeroth Questing Addon `0.3.0-beta.18` or newer to produce `AQM1` records and Azeroth Questing Server API `0.2.9` or newer to accept map batches. GitHub compilation/installer success does not count as Windows runtime, WoW, or live-server validation. After the compatible server is deployed, verify that moving between multiple UiMapIDs causes map observations to synchronize while existing quest observations continue to upload normally. If trusted signing remains unavailable, this Beta may be published as an explicitly unsigned testing build; Stable still requires trusted signing.

'''
          if not current.startswith('# Changelog\n'):
              raise SystemExit('Unexpected changelog header')
          changelog.write_text(entry + current[len('# Changelog\n\n'):], encoding='utf-8')
          PY

          dotnet restore src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          dotnet build src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj -c Release --no-restore
          git diff --check

      - name: Commit Companion Beta 11
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git rm .github/workflows/prepare-map-research-beta11.yml
          git add CHANGELOG.md src/AzerothQuesting.Companion/Service01Client.cs src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          git commit -m "Release companion v0.1.9-beta.11"
          git push origin HEAD:main
