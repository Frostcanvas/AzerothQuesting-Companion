name: Build Windows Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: read

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "publish/win-x64/AzerothQuestingCompanion.exe"
          if (-not (Test-Path $exe)) {
            throw "AzerothQuestingCompanion.exe was not produced."
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AzerothQuestingCompanion-win-x64
          path: publish/win-x64/AzerothQuestingCompanion.exe
          if-no-files-found: error
