name: Build Windows Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  actions: read
  contents: write

jobs:
  build:
    runs-on: windows-latest
    env:
      SIGNPATH_ORGANIZATION_ID: ${{ vars.SIGNPATH_ORGANIZATION_ID }}
      SIGNPATH_PROJECT_SLUG: ${{ vars.SIGNPATH_PROJECT_SLUG }}
      SIGNPATH_SIGNING_POLICY_SLUG: ${{ vars.SIGNPATH_SIGNING_POLICY_SLUG }}
      SIGNPATH_EXECUTABLE_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_EXECUTABLE_ARTIFACT_CONFIGURATION_SLUG }}
      SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG: ${{ vars.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "publish/win-x64/AzerothQuestingCompanion.exe"
          if (-not (Test-Path $exe)) {
            throw "AzerothQuestingCompanion.exe was not produced."
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Determine release and signing mode
        id: release_meta
        shell: pwsh
        env:
          EVENT_NAME: ${{ github.event_name }}
          COMMIT_MESSAGE: ${{ github.event.head_commit.message }}
          SIGNPATH_API_TOKEN: ${{ secrets.SIGNPATH_API_TOKEN }}
        run: |
          $project = [xml](Get-Content "src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj")
          $version = [string]$project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read companion version from the project file."
          }

          $isRelease = $env:EVENT_NAME -eq "push" -and $env:COMMIT_MESSAGE.StartsWith("Release companion v")
          $isPrerelease = $version.Contains("-")

          $required = @{
            SIGNPATH_API_TOKEN = $env:SIGNPATH_API_TOKEN
            SIGNPATH_ORGANIZATION_ID = $env:SIGNPATH_ORGANIZATION_ID
            SIGNPATH_PROJECT_SLUG = $env:SIGNPATH_PROJECT_SLUG
            SIGNPATH_SIGNING_POLICY_SLUG = $env:SIGNPATH_SIGNING_POLICY_SLUG
            SIGNPATH_EXECUTABLE_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_EXECUTABLE_ARTIFACT_CONFIGURATION_SLUG
            SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG = $env:SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG
          }

          $missing = @()
          foreach ($item in $required.GetEnumerator()) {
            if ([string]::IsNullOrWhiteSpace([string]$item.Value)) {
              $missing += $item.Key
            }
          }

          $signingConfigured = $missing.Count -eq 0
          $signingEnabled = $isRelease -and $signingConfigured

          if ($isRelease -and -not $isPrerelease -and -not $signingConfigured) {
            throw "Stable Companion releases require SignPath configuration. Missing: $($missing -join ', ')"
          }

          if ($isRelease -and $isPrerelease -and -not $signingConfigured) {
            Write-Warning "SignPath is not fully configured. Publishing this Beta as an explicitly unsigned GitHub Pre-release for testing. Missing: $($missing -join ', ')"
          }
          elseif ($signingEnabled) {
            Write-Host "SignPath release configuration is present; this release will be signed."
          }

          "version=$version" >> $env:GITHUB_OUTPUT
          "is_release=$($isRelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "is_prerelease=$($isPrerelease.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT
          "signing_enabled=$($signingEnabled.ToString().ToLowerInvariant())" >> $env:GITHUB_OUTPUT

      - name: Prepare changelog release notes
        if: steps.release_meta.outputs.is_release == 'true'
        id: changelog_notes
        shell: pwsh
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          $displayVersion = $version
          if ($version -match '^(?<base>\d+\.\d+\.\d+)-beta\.(?<number>\d+)$') {
            $displayVersion = "$($Matches.base) Beta $($Matches.number)"
          }
          elseif ($version -match '^(?<base>\d+\.\d+\.\d+)-rc\.(?<number>\d+)$') {
            $displayVersion = "$($Matches.base) RC $($Matches.number)"
          }

          $lines = Get-Content "CHANGELOG.md"
          $start = -1
          for ($i = 0; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match "^##\s+$([regex]::Escape($displayVersion))\s+-") {
              $start = $i
              break
            }
          }

          if ($start -lt 0) {
            throw "Could not find CHANGELOG.md entry for $displayVersion."
          }

          $end = $lines.Count
          for ($i = $start + 1; $i -lt $lines.Count; $i++) {
            if ($lines[$i] -match '^##\s+') {
              $end = $i
              break
            }
          }

          $section = ($lines[$start..($end - 1)] -join "`r`n").Trim()
          if ([string]::IsNullOrWhiteSpace($section)) {
            throw "CHANGELOG.md entry for $displayVersion was empty."
          }

          $notesFile = "release-notes-$version.md"
          Set-Content -Path $notesFile -Value $section -Encoding UTF8
          "notes_file=$notesFile" >> $env:GITHUB_OUTPUT

      - name: Upload unsigned companion executable for SignPath
        if: steps.release_meta.outputs.signing_enabled == 'true'
        id: upload_unsigned_executable
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-companion-executable-${{ github.run_id }}
          path: publish/win-x64/AzerothQuestingCompanion.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign companion executable with SignPath
        if: steps.release_meta.outputs.signing_enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_EXECUTABLE_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_executable.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/publish/signpath/executable

      - name: Promote and verify signed companion executable
        if: steps.release_meta.outputs.signing_enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem "publish/signpath/executable" -Filter "AzerothQuestingCompanion.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $signed) {
            throw "SignPath did not return AzerothQuestingCompanion.exe."
          }

          Copy-Item $signed.FullName "publish/win-x64/AzerothQuestingCompanion.exe" -Force
          $signature = Get-AuthenticodeSignature "publish/win-x64/AzerothQuestingCompanion.exe"
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate
          if ($signature.Status -ne 'Valid') {
            throw "The companion executable does not have a valid Authenticode signature."
          }

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $project = [xml](Get-Content "src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj")
          $version = [string]$project.Project.PropertyGroup.Version
          $fileVersion = [string]$project.Project.PropertyGroup.FileVersion
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read companion version from the project file."
          }
          if ([string]::IsNullOrWhiteSpace($fileVersion)) {
            throw "Could not read companion file version from the project file."
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }

          & $iscc "/DMyAppVersion=$version" "/DMyAppFileVersion=$fileVersion" "installer\AzerothQuestingCompanion.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $setup = "publish/installer/AzerothQuestingCompanion-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "AzerothQuestingCompanion-Setup.exe was not produced."
          }

          Get-Item $setup | Format-List Name,Length,LastWriteTime
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - name: Upload unsigned Windows installer for SignPath
        if: steps.release_meta.outputs.signing_enabled == 'true'
        id: upload_unsigned_installer
        uses: actions/upload-artifact@v4
        with:
          name: unsigned-companion-installer-${{ github.run_id }}
          path: publish/installer/AzerothQuestingCompanion-Setup.exe
          if-no-files-found: error
          retention-days: 7

      - name: Sign Windows installer with SignPath
        if: steps.release_meta.outputs.signing_enabled == 'true'
        uses: signpath/github-action-submit-signing-request@v2
        with:
          api-token: ${{ secrets.SIGNPATH_API_TOKEN }}
          organization-id: ${{ env.SIGNPATH_ORGANIZATION_ID }}
          project-slug: ${{ env.SIGNPATH_PROJECT_SLUG }}
          signing-policy-slug: ${{ env.SIGNPATH_SIGNING_POLICY_SLUG }}
          artifact-configuration-slug: ${{ env.SIGNPATH_INSTALLER_ARTIFACT_CONFIGURATION_SLUG }}
          github-artifact-id: ${{ steps.upload_unsigned_installer.outputs.artifact-id }}
          wait-for-completion: true
          wait-for-completion-timeout-in-seconds: 3600
          output-artifact-directory: ${{ github.workspace }}/publish/signpath/installer

      - name: Promote and verify signed Windows installer
        if: steps.release_meta.outputs.signing_enabled == 'true'
        shell: pwsh
        run: |
          $signed = Get-ChildItem "publish/signpath/installer" -Filter "AzerothQuestingCompanion-Setup.exe" -File -Recurse | Select-Object -First 1
          if ($null -eq $signed) {
            throw "SignPath did not return AzerothQuestingCompanion-Setup.exe."
          }

          Copy-Item $signed.FullName "publish/installer/AzerothQuestingCompanion-Setup.exe" -Force
          $signature = Get-AuthenticodeSignature "publish/installer/AzerothQuestingCompanion-Setup.exe"
          $signature | Format-List Status,StatusMessage,SignerCertificate,TimeStamperCertificate
          if ($signature.Status -ne 'Valid') {
            throw "The Windows installer does not have a valid Authenticode signature."
          }

      - name: Upload unsigned development installer
        if: steps.release_meta.outputs.is_release != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AzerothQuestingCompanion-Setup-UNSIGNED-DEVELOPMENT
          path: publish/installer/AzerothQuestingCompanion-Setup.exe
          if-no-files-found: error

      - name: Upload signed release installer artifact
        if: steps.release_meta.outputs.is_release == 'true' && steps.release_meta.outputs.signing_enabled == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AzerothQuestingCompanion-Setup-SIGNED
          path: publish/installer/AzerothQuestingCompanion-Setup.exe
          if-no-files-found: error

      - name: Upload unsigned Beta release installer artifact
        if: steps.release_meta.outputs.is_release == 'true' && steps.release_meta.outputs.is_prerelease == 'true' && steps.release_meta.outputs.signing_enabled != 'true'
        uses: actions/upload-artifact@v4
        with:
          name: AzerothQuestingCompanion-Setup-UNSIGNED-BETA
          path: publish/installer/AzerothQuestingCompanion-Setup.exe
          if-no-files-found: error

      - name: Publish GitHub Release
        if: steps.release_meta.outputs.is_release == 'true'
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
          SIGNING_ENABLED: ${{ steps.release_meta.outputs.signing_enabled }}
        run: |
          $version = "${{ steps.release_meta.outputs.version }}"
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Release metadata did not include a Companion version."
          }

          $tag = "companion-v$version"
          $asset = "publish/installer/AzerothQuestingCompanion-Setup.exe"
          $isPrerelease = $version.Contains("-")
          $notesFile = "${{ steps.changelog_notes.outputs.notes_file }}"
          if ([string]::IsNullOrWhiteSpace($notesFile) -or -not (Test-Path $notesFile)) {
            throw "Changelog-derived release notes were not prepared."
          }

          if ($env:SIGNING_ENABLED -eq "true") {
            $policyHeader = @"
          **Code signing policy**

          This installer was signed through SignPath.

          Free code signing provided by SignPath.io, certificate by SignPath Foundation.

          Code signing policy: https://github.com/Frostcanvas/AzerothQuesting-Companion/blob/main/CODE_SIGNING.md
          Privacy policy: https://github.com/Frostcanvas/AzerothQuesting-Companion/blob/main/PRIVACY.md
          "@
          }
          else {
            $policyHeader = @"
          **Unsigned Beta testing build**

          This GitHub Pre-release is intentionally unsigned while Azeroth Questing Companion is waiting for code-signing setup. Windows SmartScreen or security software may warn before installation. Stable releases remain blocked unless they are signed.

          Code signing policy: https://github.com/Frostcanvas/AzerothQuesting-Companion/blob/main/CODE_SIGNING.md
          Privacy policy: https://github.com/Frostcanvas/AzerothQuesting-Companion/blob/main/PRIVACY.md
          "@
          }

          $changelog = Get-Content $notesFile -Raw
          $combined = "$policyHeader`r`n`r`n$changelog"
          Set-Content -Path "release-notes.tmp.md" -Value $combined -Encoding UTF8

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            if ($isPrerelease) {
              gh release create $tag --target $env:GITHUB_SHA --title "Azeroth Questing Companion v$version" --notes-file "release-notes.tmp.md" --prerelease
            }
            else {
              gh release create $tag --target $env:GITHUB_SHA --title "Azeroth Questing Companion v$version" --notes-file "release-notes.tmp.md"
            }
          }
          else {
            gh release edit $tag --notes-file "release-notes.tmp.md"
          }

          gh release upload $tag $asset --clobber
