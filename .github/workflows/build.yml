name: Build Windows Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=false
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "publish/win-x64/AzerothQuestingCompanion.exe"
          if (-not (Test-Path $exe)) {
            throw "AzerothQuestingCompanion.exe was not produced."
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Install Inno Setup
        shell: pwsh
        run: choco install innosetup --yes --no-progress

      - name: Build Windows installer
        shell: pwsh
        run: |
          $project = [xml](Get-Content "src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj")
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read companion version from the project file."
          }

          $iscc = "${env:ProgramFiles(x86)}\Inno Setup 6\ISCC.exe"
          if (-not (Test-Path $iscc)) {
            throw "Inno Setup compiler was not found at $iscc"
          }

          & $iscc "/DMyAppVersion=$version" "installer\AzerothQuestingCompanion.iss"
          if ($LASTEXITCODE -ne 0) {
            throw "Inno Setup failed with exit code $LASTEXITCODE"
          }

          $setup = "publish/installer/AzerothQuestingCompanion-Setup.exe"
          if (-not (Test-Path $setup)) {
            throw "AzerothQuestingCompanion-Setup.exe was not produced."
          }

          Get-Item $setup | Format-List Name,Length,LastWriteTime
          Get-FileHash $setup -Algorithm SHA256 | Format-List

      - name: Upload Windows installer
        uses: actions/upload-artifact@v4
        with:
          name: AzerothQuestingCompanion-Setup
          path: publish/installer/AzerothQuestingCompanion-Setup.exe
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release companion v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $project = [xml](Get-Content "src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj")
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read companion version from the project file."
          }

          $tag = "companion-v$version"
          $asset = "publish/installer/AzerothQuestingCompanion-Setup.exe"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Azeroth Questing Companion v$version" --generate-notes
          }

          gh release upload $tag $asset --clobber
