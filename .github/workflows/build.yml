name: Build Windows Companion

on:
  push:
    branches:
      - main
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: windows-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Restore
        run: dotnet restore src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj

      - name: Publish self-contained Windows x64 app
        run: >-
          dotnet publish src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          -c Release
          -r win-x64
          --self-contained true
          -p:PublishSingleFile=true
          -p:EnableCompressionInSingleFile=true
          -p:IncludeNativeLibrariesForSelfExtract=true
          -p:DebugType=None
          -p:DebugSymbols=false
          -o publish/win-x64

      - name: Verify executable
        shell: pwsh
        run: |
          $exe = "publish/win-x64/AzerothQuestingCompanion.exe"
          if (-not (Test-Path $exe)) {
            throw "AzerothQuestingCompanion.exe was not produced."
          }
          Get-Item $exe | Format-List Name,Length,LastWriteTime

      - name: Create Windows update package
        shell: pwsh
        run: |
          $zip = "publish/AzerothQuestingCompanion-win-x64.zip"
          if (Test-Path $zip) { Remove-Item $zip -Force }
          Compress-Archive -Path "publish/win-x64/AzerothQuestingCompanion.exe" -DestinationPath $zip -CompressionLevel Optimal
          Get-FileHash $zip -Algorithm SHA256 | Format-List

      - name: Upload Windows build
        uses: actions/upload-artifact@v4
        with:
          name: AzerothQuestingCompanion-win-x64
          path: publish/AzerothQuestingCompanion-win-x64.zip
          if-no-files-found: error

      - name: Publish versioned GitHub Release
        if: github.event_name == 'push' && startsWith(github.event.head_commit.message, 'Release companion v')
        shell: pwsh
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          $project = [xml](Get-Content "src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj")
          $version = $project.Project.PropertyGroup.Version
          if ([string]::IsNullOrWhiteSpace($version)) {
            throw "Could not read companion version from the project file."
          }

          $tag = "companion-v$version"
          $asset = "publish/AzerothQuestingCompanion-win-x64.zip"

          gh release view $tag 2>$null
          if ($LASTEXITCODE -ne 0) {
            gh release create $tag --target $env:GITHUB_SHA --title "Azeroth Questing Companion v$version" --generate-notes
          }

          gh release upload $tag $asset --clobber
