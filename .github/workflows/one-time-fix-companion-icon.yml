name: One-time fix Companion application icon

on:
  push:
    branches:
      - main
    paths:
      - .github/workflows/one-time-fix-companion-icon.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest

    steps:
      - name: Check out repository
        uses: actions/checkout@v6
        with:
          fetch-depth: 0

      - name: Apply icon fix to current 0.1.9 Beta 1
        shell: bash
        run: |
          set -euo pipefail
          python3 - <<'PY'
          from pathlib import Path

          def replace_once(path, old, new):
              p = Path(path)
              text = p.read_text(encoding='utf-8')
              count = text.count(old)
              if count != 1:
                  raise SystemExit(f'{path}: expected exactly one match, found {count}: {old!r}')
              p.write_text(text.replace(old, new, 1), encoding='utf-8')

          csproj = Path('src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj')
          csproj_text = csproj.read_text(encoding='utf-8')
          if '<Version>0.1.9-beta.1</Version>' not in csproj_text:
              raise SystemExit('Expected current Companion version 0.1.9-beta.1')
          if 'CopyToPublishDirectory' not in csproj_text:
              replace_once(
                  csproj,
                  '  </PropertyGroup>\n</Project>\n',
                  '  </PropertyGroup>\n  <ItemGroup>\n    <None Update="Assets\\AzerothQuesting.ico">\n      <CopyToOutputDirectory>PreserveNewest</CopyToOutputDirectory>\n      <CopyToPublishDirectory>PreserveNewest</CopyToPublishDirectory>\n    </None>\n  </ItemGroup>\n</Project>\n',
              )

          icon_helper = Path('src/AzerothQuesting.Companion/AppIcon.cs')
          icon_helper.write_text('''namespace AzerothQuesting.Companion;\n\ninternal static class AppIcon\n{\n    public static Icon Load()\n    {\n        var iconPath = Path.Combine(AppContext.BaseDirectory, "Assets", "AzerothQuesting.ico");\n        if (File.Exists(iconPath))\n        {\n            return new Icon(iconPath);\n        }\n\n        return Icon.ExtractAssociatedIcon(Application.ExecutablePath)\n            ?? (Icon)SystemIcons.Application.Clone();\n    }\n}\n''', encoding='utf-8')

          replace_once(
              'src/AzerothQuesting.Companion/MainForm.cs',
              '        Text = "Azeroth Questing Companion";\n        StartPosition = FormStartPosition.CenterScreen;',
              '        Text = "Azeroth Questing Companion";\n        Icon = AppIcon.Load();\n        StartPosition = FormStartPosition.CenterScreen;',
          )
          replace_once(
              'src/AzerothQuesting.Companion/MainForm.cs',
              '            Icon = SystemIcons.Application,',
              '            Icon = AppIcon.Load(),',
          )

          replace_once(
              'src/AzerothQuesting.Companion/DataViewerForm.cs',
              '        Text = "Azeroth Questing - Submitted Data";\n        StartPosition = FormStartPosition.CenterParent;',
              '        Text = "Azeroth Questing - Submitted Data";\n        Icon = AppIcon.Load();\n        StartPosition = FormStartPosition.CenterParent;',
          )

          installer = Path('installer/AzerothQuestingCompanion.iss')
          installer_text = installer.read_text(encoding='utf-8')
          if 'SetupIconFile=' not in installer_text:
              replace_once(
                  installer,
                  'WizardStyle=modern\n',
                  'WizardStyle=modern\nSetupIconFile=..\\src\\AzerothQuesting.Companion\\Assets\\AzerothQuesting.ico\nChangesAssociations=yes\n',
              )
          replace_once(
              installer,
              'UninstallDisplayIcon={app}\\{#MyAppExeName}',
              'UninstallDisplayIcon={app}\\Assets\\AzerothQuesting.ico',
          )
          replace_once(
              installer,
              'Name: "{autoprograms}\\Azeroth Questing Companion"; Filename: "{app}\\{#MyAppExeName}"',
              'Name: "{autoprograms}\\Azeroth Questing Companion"; Filename: "{app}\\{#MyAppExeName}"; IconFilename: "{app}\\Assets\\AzerothQuesting.ico"',
          )
          replace_once(
              installer,
              'Name: "{autodesktop}\\Azeroth Questing Companion"; Filename: "{app}\\{#MyAppExeName}"; Tasks: desktopicon',
              'Name: "{autodesktop}\\Azeroth Questing Companion"; Filename: "{app}\\{#MyAppExeName}"; IconFilename: "{app}\\Assets\\AzerothQuesting.ico"; Tasks: desktopicon\nName: "{autodesktop}\\Azeroth Questing Companion"; Filename: "{app}\\{#MyAppExeName}"; IconFilename: "{app}\\Assets\\AzerothQuesting.ico"; Check: DesktopShortcutExists',
          )
          code_marker = '[Code]\nfunction IsSilentInstall: Boolean;'
          code_replacement = '''[Code]\nfunction DesktopShortcutExists: Boolean;\nbegin\n  Result := FileExists(ExpandConstant('{autodesktop}\\Azeroth Questing Companion.lnk'));\nend;\n\nfunction IsSilentInstall: Boolean;'''
          replace_once(installer, code_marker, code_replacement)

          changelog = Path('CHANGELOG.md')
          changelog_text = changelog.read_text(encoding='utf-8')
          anchor = '- Kept GitHub tags/releases and updater comparison on canonical prerelease versions such as `0.1.9-beta.1`; the friendly **Beta 1** wording is a player-facing presentation layer only.\n'
          icon_note = '- Fixed the Companion application icon so installed desktop and Start Menu shortcuts, the main window, Submitted Research Data window, notification-area icon, installer, and Windows uninstall entry use the Azeroth Questing icon instead of the generic Windows application icon. Existing desktop shortcuts are refreshed during an upgrade when they are already present, without creating a desktop shortcut for players who previously chose not to have one.\n'
          if icon_note not in changelog_text:
              if anchor not in changelog_text:
                  raise SystemExit('Could not find 0.1.9 Beta 1 changelog insertion point')
              changelog_text = changelog_text.replace(anchor, anchor + icon_note, 1)

          old_test = 'This beta still needs Windows testing. Verify that the Companion displays **0.1.9 Beta 1** in player-facing surfaces, still compares GitHub prereleases correctly, and continues reporting/updating normally. The Azeroth Questing addon itself was not changed and remains `0.2.32`; the same beta/golden version model is intended for its next beta train.'
          new_test = 'This beta still needs Windows testing. Verify that the Companion displays **0.1.9 Beta 1** in player-facing surfaces, still compares GitHub prereleases correctly, and continues reporting/updating normally. Also install it over an older Companion build that already has a desktop shortcut and verify the Azeroth Questing icon appears on the desktop shortcut, Start Menu shortcut, main/title-bar window, Submitted Research Data window, notification area, installer, and Windows Installed Apps/uninstall entry. The Azeroth Questing addon itself was not changed by this Companion icon fix.'
          if old_test not in changelog_text:
              raise SystemExit('Could not find current 0.1.9 Beta 1 testing paragraph')
          changelog.write_text(changelog_text.replace(old_test, new_test, 1), encoding='utf-8')
          PY

      - name: Validate changes
        shell: bash
        run: |
          set -euo pipefail
          grep -Fq '<Version>0.1.9-beta.1</Version>' src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          grep -Fq '<CopyToPublishDirectory>PreserveNewest</CopyToPublishDirectory>' src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj
          grep -Fq 'Icon = AppIcon.Load();' src/AzerothQuesting.Companion/MainForm.cs
          grep -Fq 'Icon = AppIcon.Load(),' src/AzerothQuesting.Companion/MainForm.cs
          grep -Fq 'Icon = AppIcon.Load();' src/AzerothQuesting.Companion/DataViewerForm.cs
          grep -Fq 'IconFilename: "{app}\Assets\AzerothQuesting.ico"' installer/AzerothQuestingCompanion.iss
          grep -Fq 'DesktopShortcutExists' installer/AzerothQuestingCompanion.iss
          grep -Fq 'Fixed the Companion application icon' CHANGELOG.md
          git diff --check

      - name: Commit icon fix
        shell: bash
        run: |
          set -euo pipefail
          git config user.name Frostcanvas
          git config user.email 131615585+Frostcanvas@users.noreply.github.com
          git add src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj \
                  src/AzerothQuesting.Companion/AppIcon.cs \
                  src/AzerothQuesting.Companion/MainForm.cs \
                  src/AzerothQuesting.Companion/DataViewerForm.cs \
                  installer/AzerothQuestingCompanion.iss \
                  CHANGELOG.md
          git commit -m 'Fix Companion application icon in 0.1.9 Beta 1'
          git push origin HEAD:main
