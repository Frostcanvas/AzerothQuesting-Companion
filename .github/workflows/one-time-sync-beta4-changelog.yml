name: One-time sync Companion Beta 4 changelog release notes

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  sync:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Sync changelog publication status and GitHub release notes
        shell: bash
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          set -euo pipefail

          python3 -c "from pathlib import Path; p=Path('CHANGELOG.md'); t=p.read_text(encoding='utf-8'); old='## 0.1.9 Beta 4 - September 9, 2026'; new='## 0.1.9 Beta 4 - September 9, 2026 - Available on GitHub Pre-release'; p.write_text(t if new in t else t.replace(old,new,1), encoding='utf-8')"

          awk '
            BEGIN { found = 0 }
            /^## 0\.1\.9 Beta 4 -/ { found = 1 }
            found && /^## / && $0 !~ /^## 0\.1\.9 Beta 4 -/ { exit }
            found { print }
          ' CHANGELOG.md > changelog-beta4.md

          if [ ! -s changelog-beta4.md ]; then
            echo "Could not extract Beta 4 changelog notes." >&2
            exit 1
          fi

          {
            echo '**Unsigned Beta testing build**'
            echo
            echo 'This GitHub Pre-release is intentionally unsigned while Azeroth Questing Companion is waiting for code-signing setup. Windows SmartScreen or security software may warn before installation. Stable releases remain blocked unless they are signed.'
            echo
            echo 'Code signing policy: https://github.com/Frostcanvas/AzerothQuesting-Companion/blob/main/CODE_SIGNING.md'
            echo 'Privacy policy: https://github.com/Frostcanvas/AzerothQuesting-Companion/blob/main/PRIVACY.md'
            echo
            cat changelog-beta4.md
          } > release-notes-beta4.md

          gh release edit companion-v0.1.9-beta.4 --notes-file release-notes-beta4.md

          if ! git diff --quiet -- CHANGELOG.md; then
            git config user.name "github-actions[bot]"
            git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
            git add CHANGELOG.md
            git commit -m "Mark Companion 0.1.9 Beta 4 as published prerelease"
            git push
          fi
