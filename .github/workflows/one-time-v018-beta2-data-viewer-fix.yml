name: One-time v0.1.8 beta 2 implementation patch

on:
  push:
    paths:
      - .github/workflows/one-time-v018-beta2-data-viewer-fix.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply Companion beta 2 implementation
        shell: bash
        run: |
          set -euo pipefail
          printf '%s' '' | base64 -d | gzip -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Commit implementation and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-v018-beta2-data-viewer-fix.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Complete submitted data viewer v0.1.8-beta.2"
          git push
