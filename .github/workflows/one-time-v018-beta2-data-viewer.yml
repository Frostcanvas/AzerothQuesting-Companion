name: One-time v0.1.8 beta 2 data viewer patch

on:
  push:
    paths:
      - .github/workflows/one-time-v018-beta2-data-viewer.yml

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Apply Companion beta 2 patch
        shell: bash
        run: |
          echo ' bicsCiAgICAiTWFpbkZvcm0gY2hhbm5lbCBmaWVsZCIsCikK' | tr -d ' ' | base64 -d > /tmp/patch.py
          python /tmp/patch.py

      - name: Commit beta 2 implementation and remove one-time workflow
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/one-time-v018-beta2-data-viewer.yml
          git diff --check
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Add submitted data viewer in v0.1.8-beta.2"
          git push
