name: Rescue Companion map identity Beta 12

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  prepare:
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v6

      - name: Set up .NET 10
        uses: actions/setup-dotnet@v5
        with:
          dotnet-version: 10.0.x

      - name: Reuse preparation script with cross-platform Windows targeting
        shell: bash
        run: |
          set -euo pipefail
          python3 <<'PY'
          from pathlib import Path

          helper = Path('.github/workflows/prepare-map-identity-beta12.yml')
          source = helper.read_text(encoding='utf-8')
          marker = '      - name: Apply AQM2 parsing and version changes\n        shell: bash\n        run: |\n'
          tail = source.split(marker, 1)[1]
          block = tail.split('\n      - name: Commit prepared Beta 12', 1)[0]
          lines = [line[10:] if line.startswith('          ') else line for line in block.splitlines()]
          script = '\n'.join(lines) + '\n'
          script = script.replace(
              'dotnet restore src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj',
              'dotnet restore src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj -p:EnableWindowsTargeting=true',
          )
          script = script.replace(
              'dotnet build src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj -c Release --no-restore',
              'dotnet build src/AzerothQuesting.Companion/AzerothQuesting.Companion.csproj -c Release --no-restore -p:EnableWindowsTargeting=true',
          )
          Path('/tmp/apply-beta12.sh').write_text(script, encoding='utf-8')
          PY
          bash /tmp/apply-beta12.sh

      - name: Commit prepared Beta 12
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/prepare-map-identity-beta12.yml
          rm -f .github/workflows/rescue-map-identity-beta12.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "Prepare companion v0.1.9-beta.12 map identity research"
          git push
